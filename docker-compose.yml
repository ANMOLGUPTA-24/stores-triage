services:
  postgres:
    image: postgres:16-alpine
    container_name: stores-triage-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-stores}
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - stores-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stores} -d ${POSTGRES_DB:-stores}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  stores-pgdata:
